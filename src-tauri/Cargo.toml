[package]
name = "bluetrace-desktop"
version = "1.0.0"
description = "BlueTrace AI - MEP Estimating Workstation Desktop Shell (Tauri v2)"
authors = ["BlueTrace AI Engineering"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "bluetrace_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-updater = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
