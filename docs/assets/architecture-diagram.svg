<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap');
      .title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 20px; fill: #0A0F1E; }
      .subtitle { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 13px; fill: #435264; }
      .box-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 15px; fill: #0A0F1E; }
      .box-desc { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 12px; fill: #435264; line-height: 1.4; }
      .mono { font-family: 'IBM Plex Mono', monospace; font-size: 11px; fill: #005BFF; font-weight: 600; }
      .badge { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; text-anchor: middle; }
      .wire { stroke: #AEBBC9; stroke-width: 2; stroke-dasharray: 4,4; fill: none; }
      .wire-active { stroke: #005BFF; stroke-width: 2.5; fill: none; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0A0F1E" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#005BFF"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8995A4"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="680" fill="#F8FAFC" rx="12"/>
  <rect x="20" y="20" width="1160" height="640" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Grid Blueprint Dots -->
  <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#CBD5E1" opacity="0.5"/>
  </pattern>
  <rect x="20" y="20" width="1160" height="640" fill="url(#dot-grid)" rx="8"/>

  <!-- Header -->
  <g transform="translate(60, 52)">
    <!-- Official BlueTrace Geometric Brand Symbol -->
    <g transform="translate(0, -2) scale(0.18)">
      <path d="M 6 35 L 58 5 L 118 40 L 118 105 L 91 121 L 91 76 L 58 57 L 6 88 Z" fill="#005BFF"/>
      <path d="M 6 103 L 34 119 L 34 160 L 118 112 L 118 145 L 34 193 L 6 177 Z" fill="#123A78"/>
    </g>
    <text x="32" y="24" class="title">BlueTraceAI Architecture</text>
    <text x="312" y="24" class="subtitle">|  Hybrid Deterministic Vector Engine + Meta Model Perception</text>
  </g>

  <!-- COLUMN 1: INPUT INTAKE -->
  <g transform="translate(60, 110)">
    <rect width="220" height="490" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="196" height="32" rx="4" fill="#E2E8F0"/>
    <text x="110" y="33" class="box-title" text-anchor="middle">1. Drawing Intake</text>
    
    <!-- Sub-card: Native PDF -->
    <g transform="translate(15, 60)">
      <rect width="190" height="95" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="12" y="25" class="box-title" font-size="13">Raw 2D PDF Drawing</text>
      <text x="12" y="45" class="box-desc">Vector paths &amp; raster scans</text>
      <text x="12" y="65" class="box-desc">Mixed scales across sheets</text>
      <text x="12" y="83" class="mono">PyMuPDF @ 150 DPI</text>
    </g>

    <!-- Sub-card: Title Block Recon -->
    <g transform="translate(15, 175)">
      <rect width="190" height="120" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="12" y="24" class="box-title" font-size="13">Title Block Recon</text>
      <text x="12" y="44" class="box-desc">Sheet # &amp; Discipline tag</text>
      <text x="12" y="62" class="box-desc">Scale parsing (1/8"=1'-0")</text>
      <rect x="12" y="78" width="166" height="26" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
      <text x="95" y="95" class="badge" fill="#92400E">FAIL-CLOSED SCALE RULE</text>
    </g>

    <!-- Sub-card: Virtualized Canvas -->
    <g transform="translate(15, 315)">
      <rect width="190" height="155" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="12" y="24" class="box-title" font-size="13">Hardware Canvas</text>
      <text x="12" y="44" class="box-desc">React 19 + 60fps pan/zoom</text>
      <text x="12" y="62" class="box-desc">2D Affine screen matrix</text>
      <text x="12" y="80" class="box-desc">Sub-400ms point-of-need</text>
      <rect x="12" y="98" width="166" height="42" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
      <text x="95" y="115" class="badge" fill="#1E40AF">DISCIPLINE OVERLAYS</text>
      <text x="95" y="130" class="mono" font-size="10" text-anchor="middle">HVAC • Elec • Plumb • Fire</text>
    </g>
  </g>

  <!-- Connectors from Column 1 to Column 2 -->
  <path d="M 280 230 L 350 230" stroke="#005BFF" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 280 440 L 350 440" stroke="#005BFF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- COLUMN 2: THE HYBRID DIVISION -->
  <!-- Top Branch: Deterministic Vector Core -->
  <g transform="translate(350, 110)">
    <rect width="460" height="230" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
    <rect x="12" y="12" width="436" height="30" rx="4" fill="#DCFCE7"/>
    <text x="230" y="32" class="box-title" text-anchor="middle" fill="#166534">2A. Deterministic Vector Engine (Local Python)</text>
    
    <g transform="translate(15, 55)">
      <rect width="205" height="155" rx="6" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1" filter="url(#shadow)"/>
      <text x="12" y="24" class="box-title" font-size="13" fill="#15803D">Linework &amp; Centerline</text>
      <text x="12" y="46" class="box-desc">PyMuPDF path extraction</text>
      <text x="12" y="66" class="box-desc">Shapely medial-axis pairing</text>
      <text x="12" y="86" class="box-desc">NetworkX graph continuity</text>
      <text x="12" y="106" class="box-desc">T-Junction &amp; elbow routing</text>
      <text x="12" y="132" class="mono">Zero Hallucinations</text>
    </g>

    <g transform="translate(240, 55)">
      <rect width="205" height="155" rx="6" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1" filter="url(#shadow)"/>
      <text x="12" y="24" class="box-title" font-size="13" fill="#15803D">Mathematical Scale</text>
      <text x="12" y="46" class="box-desc">Verified scale ratio: S_ratio</text>
      <text x="12" y="66" class="box-desc">L_ft = (L_pt * S_ratio) / 864</text>
      <text x="12" y="86" class="box-desc">2-Point manual ruler check</text>
      <text x="12" y="106" class="box-desc">SMACNA pound weights</text>
      <text x="12" y="132" class="mono">Absolute Ground Truth</text>
    </g>
  </g>

  <!-- Bottom Branch: Meta AI Model Perception -->
  <g transform="translate(350, 370)">
    <rect width="460" height="230" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="12" y="12" width="436" height="30" rx="4" fill="#DBEAFE"/>
    <text x="230" y="32" class="box-title" text-anchor="middle" fill="#1E40AF">2B. Meta Model API (Perception &amp; Copilot)</text>

    <g transform="translate(15, 55)">
      <rect width="135" height="155" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1" filter="url(#shadow)"/>
      <text x="10" y="22" class="box-title" font-size="12" fill="#1E3A8A">muse-spark-1.3</text>
      <text x="10" y="42" class="box-desc" font-size="11">Visual OCR</text>
      <text x="10" y="58" class="box-desc" font-size="11">Point-of-need crops</text>
      <text x="10" y="74" class="box-desc" font-size="11">300x300px windows</text>
      <text x="10" y="90" class="box-desc" font-size="11">Legend parsing</text>
      <text x="10" y="106" class="box-desc" font-size="11">Schedule tables</text>
      <text x="10" y="132" class="mono" font-size="10">Sub-second OCR</text>
    </g>

    <g transform="translate(162, 55)">
      <rect width="135" height="155" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1" filter="url(#shadow)"/>
      <text x="10" y="22" class="box-title" font-size="12" fill="#1E3A8A">sam-3.1</text>
      <text x="10" y="42" class="box-desc" font-size="11">Region Isolator</text>
      <text x="10" y="58" class="box-desc" font-size="11">Zero-shot mask</text>
      <text x="10" y="74" class="box-desc" font-size="11">Bounding boxes</text>
      <text x="10" y="90" class="box-desc" font-size="11">Legend exemplar</text>
      <text x="10" y="106" class="box-desc" font-size="11">Ghost pin match</text>
      <text x="10" y="132" class="mono" font-size="10">Segmentation</text>
    </g>

    <g transform="translate(310, 55)">
      <rect width="135" height="155" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1" filter="url(#shadow)"/>
      <text x="10" y="22" class="box-title" font-size="12" fill="#1E3A8A">muse-wonder-1.0</text>
      <text x="10" y="42" class="box-desc" font-size="11">Copilot-Judge</text>
      <text x="10" y="58" class="box-desc" font-size="11">Tool-call action</text>
      <text x="10" y="74" class="box-desc" font-size="11">Natural language</text>
      <text x="10" y="90" class="box-desc" font-size="11">Bulk batch edits</text>
      <text x="10" y="106" class="box-desc" font-size="11">Actionable cards</text>
      <text x="10" y="132" class="mono" font-size="10">Reasoning Core</text>
    </g>
  </g>

  <!-- Connectors from Column 2 to Column 3 -->
  <path d="M 810 225 L 880 280" stroke="#005BFF" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 810 485 L 880 430" stroke="#005BFF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- COLUMN 3: HUMAN-IN-THE-LOOP & OUTPUT STORE -->
  <g transform="translate(880, 110)">
    <rect width="260" height="490" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="236" height="32" rx="4" fill="#E2E8F0"/>
    <text x="130" y="33" class="box-title" text-anchor="middle">3. HITL Gate &amp; Ledger</text>

    <!-- Sub-card: HITL Review Gate -->
    <g transform="translate(15, 60)">
      <rect width="230" height="125" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="12" y="24" class="box-title" font-size="13">HITL Review Gate</text>
      <text x="12" y="44" class="box-desc">Single keystroke triage: Y / N</text>
      <text x="12" y="62" class="box-desc">Auto-zoom to symbol crop</text>
      <text x="12" y="80" class="box-desc">Human estimator is final judge</text>
      <rect x="12" y="94" width="206" height="22" rx="3" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
      <text x="115" y="109" class="badge" fill="#15803D">HUMAN VERIFIED ACCURACY</text>
    </g>

    <!-- Sub-card: SQLite WAL Ledger -->
    <g transform="translate(15, 200)">
      <rect width="230" height="135" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="12" y="24" class="box-title" font-size="13">SQLite WAL Store</text>
      <text x="12" y="44" class="box-desc">Immutable review_events table</text>
      <text x="12" y="62" class="box-desc">Audit trail (who / what / when)</text>
      <text x="12" y="80" class="box-desc">Coordinates + scale receipts</text>
      <text x="12" y="98" class="box-desc">aiosqlite async transactions</text>
      <text x="12" y="120" class="mono">Enterprise Audit Trail</text>
    </g>

    <!-- Sub-card: Verified Exports -->
    <g transform="translate(15, 350)">
      <rect width="230" height="120" rx="6" fill="#FFFFFF" stroke="#005BFF" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="12" y="24" class="box-title" font-size="13" fill="#005BFF">Verified Takeoff Export</text>
      <text x="12" y="44" class="box-desc">SMACNA Ductwork schedule</text>
      <text x="12" y="62" class="box-desc">Gauge, weight, connection sets</text>
      <text x="12" y="80" class="box-desc">Clickable drawing coordinates</text>
      <rect x="12" y="92" width="206" height="20" rx="3" fill="#005BFF"/>
      <text x="115" y="106" class="badge" fill="#FFFFFF">CSV &amp; JSON BID PACKS</text>
    </g>
  </g>
</svg>
