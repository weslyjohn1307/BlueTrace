<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 210" width="920" height="210" role="img" aria-label="BlueTrace — MEP Drawing Intelligence">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0F1E"/>
      <stop offset="55%" style="stop-color:#0D162C"/>
      <stop offset="100%" style="stop-color:#12254A"/>
    </linearGradient>
    <linearGradient id="scanline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#37C6FF;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#37C6FF;stop-opacity:0.20"/>
      <stop offset="100%" style="stop-color:#37C6FF;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="65%" style="stop-color:#F5F7FA"/>
      <stop offset="100%" style="stop-color:#E9F4FF"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#37C6FF;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#005BFF;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#37C6FF;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#005BFF;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#37C6FF;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="svgClip">
      <rect width="920" height="210" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#svgClip)">
    <rect width="920" height="210" fill="url(#bg)"/>

    <!-- Blueprint Network Grid Pattern -->
    <g opacity="0.08">
      <line x1="0" y1="30" x2="920" y2="30" stroke="#37C6FF" stroke-width="0.75"/>
      <line x1="0" y1="60" x2="920" y2="60" stroke="#37C6FF" stroke-width="0.75"/>
      <line x1="0" y1="90" x2="920" y2="90" stroke="#37C6FF" stroke-width="0.75"/>
      <line x1="0" y1="120" x2="920" y2="120" stroke="#37C6FF" stroke-width="0.75"/>
      <line x1="0" y1="150" x2="920" y2="150" stroke="#37C6FF" stroke-width="0.75"/>
      <line x1="0" y1="180" x2="920" y2="180" stroke="#37C6FF" stroke-width="0.75"/>
      <line x1="75" y1="0" x2="75" y2="210" stroke="#37C6FF" stroke-width="0.75"/>
      <line x1="150" y1="0" x2="150" y2="210" stroke="#37C6FF" stroke-width="0.75"/>
      <line x1="225" y1="0" x2="225" y2="210" stroke="#37C6FF" stroke-width="0.75"/>
      <line x1="300" y1="0" x2="300" y2="210" stroke="#37C6FF" stroke-width="0.75"/>
      <line x1="375" y1="0" x2="375" y2="210" stroke="#37C6FF" stroke-width="0.75"/>
      <line x1="450" y1="0" x2="450" y2="210" stroke="#37C6FF" stroke-width="0.75"/>
      <line x1="525" y1="0" x2="525" y2="210" stroke="#37C6FF" stroke-width="0.75"/>
      <line x1="600" y1="0" x2="600" y2="210" stroke="#37C6FF" stroke-width="0.75"/>
      <line x1="675" y1="0" x2="675" y2="210" stroke="#37C6FF" stroke-width="0.75"/>
      <line x1="750" y1="0" x2="750" y2="210" stroke="#37C6FF" stroke-width="0.75"/>
      <line x1="825" y1="0" x2="825" y2="210" stroke="#37C6FF" stroke-width="0.75"/>
      <line x1="900" y1="0" x2="900" y2="210" stroke="#37C6FF" stroke-width="0.75"/>
    </g>

    <!-- Laser Scanline Sweep Animation -->
    <rect width="920" height="210" fill="url(#scanline)">
      <animateTransform attributeName="transform" type="translate" from="-920 0" to="920 0" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- Blueprint CAD Vector Linework - Left Panel -->
    <g filter="url(#glow)">
      <line x1="35" y1="102" x2="175" y2="102" stroke="#005BFF" stroke-width="2.2" stroke-dasharray="140" stroke-dashoffset="0"/>
      <line x1="35" y1="118" x2="175" y2="118" stroke="#37C6FF" stroke-width="1.6" opacity="0.85"/>
      <line x1="125" y1="102" x2="125" y2="52" stroke="#005BFF" stroke-width="1.8"/>
      <line x1="125" y1="118" x2="125" y2="160" stroke="#37C6FF" stroke-width="1.5" opacity="0.85"/>
      <line x1="35" y1="94" x2="35" y2="126" stroke="#64748b" stroke-width="0.9"/>
      <line x1="175" y1="94" x2="175" y2="126" stroke="#64748b" stroke-width="0.9"/>
      <text x="105" y="138" fill="#E9F4FF" font-size="8.5" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">1/8" = 1'-0" (S=96)</text>
      <circle cx="125" cy="102" r="3" fill="#37C6FF"/>
      <circle cx="125" cy="118" r="2.5" fill="#005BFF"/>
      <circle cx="35" cy="102" r="2.5" fill="#37C6FF"/>
      <circle cx="175" cy="102" r="2.5" fill="#37C6FF"/>
    </g>

    <!-- Official BlueTrace Two-Plane Folded Symbol Monogram + Wordmark -->
    <g transform="translate(302, 26) scale(0.42, 0.36)">
      <path d="M 6 35 L 58 5 L 118 40 L 118 105 L 91 121 L 91 76 L 58 57 L 6 88 Z" fill="#005BFF"/>
      <path d="M 6 103 L 34 119 L 34 160 L 118 112 L 118 145 L 34 193 L 6 177 Z" fill="#37C6FF"/>
    </g>

    <text x="495" y="76" fill="url(#titleGrad)" font-size="48" font-weight="700"
          font-family="'Inter Display', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          text-anchor="middle" letter-spacing="-1.2">BlueTrace</text>
    <text x="495" y="96" fill="#37C6FF" font-size="9.5" font-weight="600"
          font-family="'IBM Plex Mono', Consolas, monospace"
          text-anchor="middle" letter-spacing="2.8">MEP DRAWING INTELLIGENCE</text>

    <!-- High-Precision Accent Bar -->
    <line x1="230" y1="110" x2="690" y2="110" stroke="url(#accentLine)" stroke-width="1.25"/>

    <!-- Official Brand Tagline -->
    <text x="460" y="136" fill="#E9F4FF" font-size="14" font-weight="400"
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          text-anchor="middle" letter-spacing="0.2">
      From Drawings to Trusted Takeoff — Vectors measure. Models interpret. Engineers approve.
    </text>

    <!-- 4 Architectural Feature Pills -->
    <g>
      <rect x="180" y="156" width="132" height="25" rx="5" fill="#0D1F49" stroke="#005BFF" stroke-width="1"/>
      <text x="246" y="173" fill="#E9F4FF" font-size="10.5" font-weight="500" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">7-agent pipeline</text>

      <rect x="324" y="156" width="130" height="25" rx="5" fill="#0A2738" stroke="#37C6FF" stroke-width="1"/>
      <text x="389" y="173" fill="#E9F4FF" font-size="10.5" font-weight="500" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">150 DPI canvas</text>

      <rect x="466" y="156" width="124" height="25" rx="5" fill="#0D1F49" stroke="#005BFF" stroke-width="1"/>
      <text x="528" y="173" fill="#37C6FF" font-size="10.5" font-weight="500" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">sub-400ms hover</text>

      <rect x="602" y="156" width="134" height="25" rx="5" fill="#361E07" stroke="#E5A044" stroke-width="1"/>
      <text x="669" y="173" fill="#FDE68A" font-size="10.5" font-weight="500" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">fail-closed scale</text>
    </g>

    <!-- Engineering Crosshairs - Right Panel Accent -->
    <g opacity="0.32">
      <circle cx="850" cy="105" r="36" fill="none" stroke="#37C6FF" stroke-width="0.8" stroke-dasharray="4 4"/>
      <circle cx="850" cy="105" r="18" fill="none" stroke="#005BFF" stroke-width="0.9"/>
      <line x1="800" y1="105" x2="900" y2="105" stroke="#37C6FF" stroke-width="0.75"/>
      <line x1="850" y1="55" x2="850" y2="155" stroke="#37C6FF" stroke-width="0.75"/>
      <text x="850" y="172" fill="#E9F4FF" font-size="7.5" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">150 DPI</text>
    </g>

    <rect width="920" height="210" rx="14" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  </g>
</svg>
